name: validate

# Validation is defined once, in `harness-skills`, and called from all
# split-out skill repos (dEitY719/dotfiles#1410 D-10). Do not re-inline the
# checks here: a copy is a drift risk, which is exactly what NF-2 forbids.
#
# To change what is checked, edit
# dEitY719/harness-skills/.github/workflows/skill-check.yml.
#
# This repo's `visualize` skill ships example HTML - posters, decks,
# infographics - that uses emoji as intentional design glyphs in the
# rendered artwork, so it exempts those trees from the shared emoji ban via
# `allow-emoji-paths` instead of inlining every other check to omit just
# that one (dEitY719/harness-skills#2, closed out here as #25).
#
# The repo-specific `lib/verify-html.sh --selftest` check is not part of the
# shared workflow; it runs via the `tests/*.sh` convention the shared
# workflow's "Repo self-checks pass (tests/)" step auto-discovers. See
# tests/verify-html-selftest.sh.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: dEitY719/harness-skills/.github/workflows/skill-check.yml@main
    with:
      plugin-name: visuals
      # Narrow to the vendored visual output CLAUDE.md names, plus the one
      # skeleton that carries the same rendered glyphs. `skills/visualize/`
      # wholesale would also unguard SKILL.md and every prose reference,
      # which is where an accidental emoji actually needs catching.
      allow-emoji-paths: |
        skills/visualize/examples/
        skills/visualize/references/skeleton.md
        docs/

  # Post-merge patch bump, owned by harness-skills: on a push to main that
  # changed shipped content, bump X.Y.Z -> X.Y.(Z+1) in every manifest and push
  # the commit. Needs write access, which only this caller can grant.
  version-bump:
    if: github.event_name == 'push'
    needs: validate
    permissions:
      contents: write
    uses: dEitY719/harness-skills/.github/workflows/version-bump.yml@main
